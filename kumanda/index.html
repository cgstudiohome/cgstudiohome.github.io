    <script>
    (function () {
        "use strict";
        const RTDB_BASE = "https://marinext-2100-default-rtdb.europe-west1.firebasedatabase.app/tv_pad_sessions";

        const I18N = {
            tr: {
                title: "📺 TV Telefon Oyun Kolu",
                sub: "Android TV ekranındaki 4 haneli kodu gir. Hiç uygulama indirmeden, aynı Wi-Fi üzerinden doğrudan LAN P2P oyun kolu olarak bağlanır.",
                connect: "🎮 TV'YE BAĞLAN",
                connecting: "🔄 TV oturumu bulunuyor...",
                badCode: "⚠️ Lütfen TV ekranındaki 4 haneli kodu gir.",
                notFound: "⚠️ Bu kodla aktif TV oturumu bulunamadı. TV ekranını kontrol et.",
                menuToggle: "🧭 Menü Tuşları",
                pause: "⏸ Duraklat",
                disconnect: "✕ Kes",
                back: "↩ Geri",
                tip: "💡 En rahat kontrol için telefonu yan çevirin",
                lan: "🟢 LAN P2P",
                cloud: "🟡 Bulut Yedek"
            },
            en: {
                title: "📺 TV Phone Gamepad",
                sub: "Enter the 4-digit code shown on your Android TV. Zero app install required — pairs over encrypted HTTPS with direct LAN P2P low-latency input.",
                connect: "🎮 CONNECT TO TV",
                connecting: "🔄 Locating TV session...",
                badCode: "⚠️ Please enter the 4-digit TV code.",
                notFound: "⚠️ No active TV session found for that code.",
                menuToggle: "🧭 Menu Pad",
                pause: "⏸ Pause",
                disconnect: "✕ Disconnect",
                back: "↩ Back",
                tip: "💡 Rotate phone horizontally for best console feel",
                lan: "🟢 LAN P2P",
                cloud: "🟡 Cloud Relay"
            }
        };

        let lang = ((navigator.language || "tr").toLowerCase().startsWith("tr")) ? "tr" : "en";
        let state = "idle"; // idle | connecting | connected
        let transport = "";
        let sessionCode = "";
        let latencyMs = 12;
        let pc = null;
        let chPad = null;
        let chCmd = null;
        let pingTimer = null;
        let seq = 0;
        let eventId = 0;
        let held = { l: 0, r: 0, j: 0 };
        const touchMap = new Map();
        let wakeLock = null;
        let manualMenuOpen = false;

        const $ = (id) => document.getElementById(id);

        function applyLang() {
            const d = I18N[lang];
            $("ui-title").textContent = d.title;
            $("ui-sub").textContent = d.sub;
            $("btn-connect").textContent = d.connect;
            $("btn-toggle-menu-pad").textContent = d.menuToggle;
            $("pad-pause").textContent = d.pause;
            $("btn-disconnect").textContent = d.disconnect;
            $("pad-nav-back").textContent = d.back;
            $("portrait-tip").textContent = d.tip;
            updateConnPill();
        }

        function updateConnPill() {
            const d = I18N[lang];
            const label = transport === "webrtc_lan" ? d.lan : d.cloud;
            $("deck-conn-pill").textContent = `${label} • ${latencyMs} ms`;
        }

        async function acquireWakeLock() {
            try {
                if (navigator.wakeLock && navigator.wakeLock.request) {
                    wakeLock = await navigator.wakeLock.request("screen");
                }
            } catch (e) {}
        }

        function sendPayload(evAction) {
            if (state !== "connected") return;
            const obj = { t: evAction ? "e" : "s", l: held.l, r: held.r, j: held.j, seq: ++seq };
            if (evAction) {
                obj.ev = evAction;
                obj.eid = ++eventId;
            }
            const raw = JSON.stringify(obj);
            if (transport === "webrtc_lan") {
                const target = evAction ? (chCmd || chPad) : (chPad || chCmd);
                if (target && target.readyState === "open") {
                    try { target.send(raw); } catch (e) {}
                }
            } else if (sessionCode) {
                fetch(`${RTDB_BASE}/${sessionCode}.json`, {
                    method: "PATCH",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ relay: raw, updatedAt: Date.now() })
                }).catch(() => {});
            }
        }

        function disconnect() {
            if (pingTimer) { clearInterval(pingTimer); pingTimer = null; }
            if (chCmd && chCmd.readyState === "open") {
                try { chCmd.send(JSON.stringify({ t: "bye" })); } catch (e) {}
            }
            if (chPad) { try { chPad.close(); } catch (e) {} chPad = null; }
            if (chCmd) { try { chCmd.close(); } catch (e) {} chCmd = null; }
            if (pc) { try { pc.close(); } catch (e) {} pc = null; }
            state = "idle";
            transport = "";
            held = { l: 0, r: 0, j: 0 };
            touchMap.clear();
            $("deck-screen").classList.add("hidden");
            $("setup-screen").classList.remove("hidden");
            $("btn-connect").disabled = false;
        }

        async function connect(codeRaw) {
            const code = String(codeRaw || "").replace(/\D/g, "").slice(0, 4);
            const d = I18N[lang];
            if (code.length !== 4) {
                $("setup-status").textContent = d.badCode;
                return;
            }
            disconnect();
            sessionCode = code;
            state = "connecting";
            $("btn-connect").disabled = true;
            $("setup-status").textContent = d.connecting;

            try {
                const res = await fetch(`${RTDB_BASE}/${code}.json`, { cache: "no-store" });
                if (!res.ok) throw new Error("http");
                const session = await res.json();
                if (!session || !session.offer) throw new Error("missing");

                let done = false;
                const finish = (trMode) => {
                    if (done && transport === "webrtc_lan") return;
                    done = true;
                    state = "connected";
                    transport = trMode;
                    latencyMs = trMode === "webrtc_lan" ? 10 : 45;
                    $("setup-screen").classList.add("hidden");
                    $("deck-screen").classList.remove("hidden");
                    updateConnPill();
                    acquireWakeLock();
                    if (typeof gtag === "function") {
                        gtag("event", "tv_pad_connected", {
                            device_form_factor: "web",
                            tv_input_mode: "phone_pad",
                            pad_transport: trMode,
                            pad_latency_ms: latencyMs
                        });
                    }
                    if (!pingTimer) {
                        pingTimer = setInterval(() => {
                            if (chCmd && chCmd.readyState === "open") {
                                try { chCmd.send(JSON.stringify({ t: "ping", ts: Date.now() })); } catch (e) {}
                            }
                        }, 1400);
                    }
                };

                if (typeof RTCPeerConnection === "function" && session.offer !== "relay-only") {
                    pc = new RTCPeerConnection({ iceServers: [{ urls: "stun:stun.l.google.com:19302" }] });
                    const localCand = [];
                    pc.onicecandidate = (ev) => {
                        if (ev.candidate) {
                            localCand.push(ev.candidate.toJSON ? ev.candidate.toJSON() : ev.candidate);
                            fetch(`${RTDB_BASE}/${code}.json`, {
                                method: "PATCH",
                                headers: { "Content-Type": "application/json" },
                                body: JSON.stringify({ padIce: JSON.stringify(localCand).slice(0, 15500), updatedAt: Date.now() })
                            }).catch(() => {});
                        }
                    };
                    pc.ondatachannel = (ev) => {
                        const ch = ev.channel;
                        if (!ch) return;
                        if (ch.label === "pad") chPad = ch;
                        else chCmd = ch;
                        ch.onopen = () => finish("webrtc_lan");
                        ch.onmessage = (mEv) => {
                            try {
                                const msg = JSON.parse(mEv.data);
                                if (msg.t === "pong" && msg.ts) {
                                    latencyMs = Math.max(1, Date.now() - Number(msg.ts));
                                    updateConnPill();
                                    if (chCmd && chCmd.readyState === "open") {
                                        chCmd.send(JSON.stringify({ t: "rtt", ms: latencyMs }));
                                    }
                                } else if (msg.t === "ctx" && !manualMenuOpen) {
                                    $("menu-strip").classList.toggle("hidden", msg.mode === "playing");
                                    $("btn-toggle-menu-pad").classList.toggle("active", msg.mode !== "playing");
                                }
                            } catch (e) {}
                        };
                    };

                    await pc.setRemoteDescription(new RTCSessionDescription(JSON.parse(session.offer)));
                    if (session.tvIce) {
                        try {
                            const tvIce = JSON.parse(session.tvIce);
                            if (Array.isArray(tvIce)) {
                                for (const c of tvIce) await pc.addIceCandidate(new RTCIceCandidate(c));
                            }
                        } catch (e) {}
                    }
                    const ans = await pc.createAnswer();
                    await pc.setLocalDescription(ans);
                    const padDeviceName = /iPhone|iPad/i.test(navigator.userAgent) ? "iPhone Web Pad" : "Android Web Pad";
                    await fetch(`${RTDB_BASE}/${code}.json`, {
                        method: "PATCH",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            answer: JSON.stringify(pc.localDescription),
                            padName: padDeviceName,
                            state: "handshake",
                            updatedAt: Date.now()
                        })
                    });

                    setTimeout(() => {
                        if (!done && state === "connecting") {
                            fetch(`${RTDB_BASE}/${code}.json`, {
                                method: "PATCH",
                                headers: { "Content-Type": "application/json" },
                                body: JSON.stringify({ state: "relay", updatedAt: Date.now() })
                            }).catch(() => {});
                            finish("firebase_relay");
                        }
                    }, 4000);
                } else {
                    await fetch(`${RTDB_BASE}/${code}.json`, {
                        method: "PATCH",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            answer: "relay-only",
                            padName: "Web Browser Pad",
                            state: "relay",
                            updatedAt: Date.now()
                        })
                    });
                    finish("firebase_relay");
                }
            } catch (e) {
                state = "idle";
                $("btn-connect").disabled = false;
                $("setup-status").textContent = d.notFound;
            }
        }

        function syncTouches() {
            let l = 0, r = 0, j = 0;
            for (const role of touchMap.values()) {
                if (role === "left") l = 1;
                else if (role === "right") r = 1;
                else if (role === "jump") j = 1;
            }
            $("pad-left").classList.toggle("pressed", Boolean(l));
            $("pad-right").classList.toggle("pressed", Boolean(r));
            $("pad-jump").classList.toggle("pressed", Boolean(j));

            const jumpEdge = (j && !held.j);
            const changed = l !== held.l || r !== held.r || j !== held.j;
            held = { l, r, j };
            if (jumpEdge) sendPayload("jump");
            else if (changed) sendPayload(null);
        }

        function bindBtn(id, role, edgeAction) {
            const el = $(id);
            el.addEventListener("touchstart", (e) => {
                if (e.cancelable) e.preventDefault();
                if (navigator.vibrate) try { navigator.vibrate(10); } catch (er) {}
                if (role) {
                    for (let i = 0; i < e.changedTouches.length; i++) touchMap.set(e.changedTouches[i].identifier, role);
                    syncTouches();
                } else if (edgeAction) {
                    el.classList.add("pressed");
                    sendPayload(edgeAction);
                }
            }, { passive: false });
            el.addEventListener("touchend", () => { if (!role) el.classList.remove("pressed"); }, { passive: true });
            el.addEventListener("mousedown", (e) => {
                if (e.button !== 0) return;
                el.classList.add("pressed");
                if (role === "left") { held.l = 1; sendPayload(null); }
                else if (role === "right") { held.r = 1; sendPayload(null); }
                else if (role === "jump") { held.j = 1; sendPayload("jump"); }
                else if (edgeAction) sendPayload(edgeAction);
            });
            el.addEventListener("mouseup", () => {
                el.classList.remove("pressed");
                if (role === "left") { held.l = 0; sendPayload(null); }
                else if (role === "right") { held.r = 0; sendPayload(null); }
                else if (role === "jump") { held.j = 0; sendPayload(null); }
            });
        }

        window.addEventListener("touchmove", (e) => {
            if (touchMap.size === 0) return;
            const lr = $("pad-left").getBoundingClientRect();
            const rr = $("pad-right").getBoundingClientRect();
            for (let i = 0; i < e.changedTouches.length; i++) {
                const t = e.changedTouches[i];
                const cur = touchMap.get(t.identifier);
                if (cur === "left" || cur === "right") {
                    if (t.clientX >= lr.left - 12 && t.clientX <= lr.right + 8 && t.clientY >= lr.top - 24 && t.clientY <= lr.bottom + 24) {
                        touchMap.set(t.identifier, "left");
                    } else if (t.clientX >= rr.left - 8 && t.clientX <= rr.right + 12 && t.clientY >= rr.top - 24 && t.clientY <= rr.bottom + 24) {
                        touchMap.set(t.identifier, "right");
                    }
                }
            }
            syncTouches();
        }, { passive: true });

        const onTouchEnd = (e) => {
            if (touchMap.size === 0) return;
            for (let i = 0; i < e.changedTouches.length; i++) touchMap.delete(e.changedTouches[i].identifier);
            if (e.touches) {
                const alive = new Set();
                for (let i = 0; i < e.touches.length; i++) alive.add(e.touches[i].identifier);
                for (const key of Array.from(touchMap.keys())) { if (!alive.has(key)) touchMap.delete(key); }
            }
            syncTouches();
        };
        window.addEventListener("touchend", onTouchEnd, { passive: true });
        window.addEventListener("touchcancel", onTouchEnd, { passive: true });

        bindBtn("pad-left", "left", null);
        bindBtn("pad-right", "right", null);
        bindBtn("pad-jump", "jump", "jump");
        bindBtn("pad-fire", null, "fire");
        bindBtn("pad-dash", null, "dash");
        bindBtn("pad-slam", null, "slam");
        bindBtn("pad-slow", null, "slow");
        bindBtn("pad-pause", null, "pause");
        bindBtn("pad-nav-up", null, "nav_up");
        bindBtn("pad-nav-down", null, "nav_down");
        bindBtn("pad-nav-left", null, "nav_left");
        bindBtn("pad-nav-right", null, "nav_right");
        bindBtn("pad-nav-ok", null, "ok");
        bindBtn("pad-nav-back", null, "back");

        $("btn-toggle-lang").addEventListener("click", () => {
            lang = (lang === "tr") ? "en" : "tr";
            applyLang();
        });
        $("btn-connect").addEventListener("click", () => connect($("pin-input").value));
        $("btn-disconnect").addEventListener("click", disconnect);
        $("btn-toggle-menu-pad").addEventListener("click", () => {
            manualMenuOpen = !$("menu-strip").classList.toggle("hidden");
            $("btn-toggle-menu-pad").classList.toggle("active", manualMenuOpen);
        });
        $("pin-input").addEventListener("keydown", (e) => {
            if (e.key === "Enter") connect($("pin-input").value);
        });
        window.addEventListener("beforeunload", disconnect);

        applyLang();
        if (typeof gtag === "function") {
            gtag("event", "tv_pad_page_view", { device_form_factor: "web" });
        }
        try {
            const urlCode = new URLSearchParams(window.location.search).get("code");
            if (urlCode && /^[0-9]{4}$/.test(urlCode)) {
                $("pin-input").value = urlCode;
                connect(urlCode);
            }
        } catch (e) {}
    })();
    </script>
</body>
</html>
